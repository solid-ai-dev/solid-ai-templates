repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Keep the two trailing spaces that end a Markdown line in a hard break.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # This repository's own documentation rule, not a hook it ships: a figure
  # about the tree comes from a generator or is not stated.
  - repo: local
    hooks:
      - id: check-doc-figures
        name: check-doc-figures
        entry: python tools/check_doc_figures.py
        language: python
        pass_filenames: false
        always_run: true
