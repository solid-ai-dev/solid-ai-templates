# Template System Manifest
# Machine-readable dependency graph for the solid-ai-templates
# composition engine. See docs/spec.md for the full specification.
#
# Fields:
#   id          — unique identifier across all layers
#   file        — path relative to repo root
#   description — one-line summary (used by sync script)
#   depends_on  — list of IDs this template extends
#   label       — human-readable name (stacks only, for interview)
#   layer       — classification (stacks only, for README table)
#   fixture     — true for test input the checks read and no listing offers
#   deprecated  — the ID that replaces this entry; it still resolves
#
# These fields are frozen for 3.x (docs/architecture/08-crosscutting-concepts.md,
# 8.7): a minor adds only optional fields.
#
# Every top-level list of entries is a section, so a fork keeps its own
# templates under a key of its own. `core` is upstream's core tier; a fork
# adds to it under `fork_core`, which every chain takes after `core`.

version: "1.0"

core: [base-quality, base-git, base-docs, base-testing, base-review]

base:
  - id: base-git
    file: templates/core/git.md
    description: Committer identity, branching, pull requests, CI evidence, regenerated artifacts, off-limits paths, .gitignore
  - id: base-docs
    file: templates/core/docs.md
    description: Rule language, standard documents, upkeep, line width, writing style, diagrams, generated files, agent output files
  - id: base-quality
    file: templates/core/quality.md
    description: Architecture, code style, calibration, tool trust, testing
  - id: base-review
    file: templates/core/review.md
    description: Peer review priority, MUST/SHOULD checklists, deviation rules
  - id: base-testing
    file: templates/core/testing.md
    description: Test types, isolation, assertions, proving a change
  - id: base-agents
    file: templates/core/agents.md
    description: Output structure, models (inline/hybrid), formatting rules
  - id: base-devsecops
    file: templates/security/devsecops.md
    description: SAST, SCA, SBOM, secret detection, license compliance
  - id: base-security
    file: templates/security/security.md
    description: Application security rules — input, output, injection, auth, sessions, TLS, headers
  - id: base-cicd
    file: templates/infra/cicd.md
    description: Pipeline gates, environments, IaC, deployment, release record
  - id: base-containers
    file: templates/infra/containers.md
    description: Dockerfile, runtime security, resource limits, image hygiene, Compose
  - id: base-config
    file: templates/core/config.md
    description: Env vars, secrets, fail-fast validation
  - id: base-deployment
    file: templates/infra/deployment.md
    description: Deployment targets, certs, load balancing, DNS, registries, secrets, network
  - id: base-data-quality
    file: templates/data/data-quality.md
    description: Data sourcing, completeness, freshness, research, scoring — data-heavy projects
    depends_on: [base-data-modeling]
  - id: base-data-modeling
    file: templates/data/data-modeling.md
    description: Schema design, naming, normalization, relationships, data types
  - id: base-data-governance
    file: templates/data/data-governance.md
    description: Classification, PII handling, retention, ownership, audit trail
    depends_on: [base-data-modeling]
  - id: base-data-migration
    file: templates/data/data-migration.md
    description: Versioned migrations, zero-downtime, rollback strategies
    depends_on: [base-data-modeling]
  - id: base-oop
    file: templates/core/oop.md
    description: SOLID, object design, hierarchies, design patterns, cross-cutting concerns; opt-in
  - id: base-quality-gates
    file: templates/core/quality-gates.md
    description: How a check is built - retrofitting a gate, pairing a constraint with its check, reading a verdict; refactor safety
    depends_on: [base-quality, base-git, base-testing, base-config]
  - id: base-embedded-checks
    file: templates/core/embedded-checks.md
    description: Checks written into Markdown - extraction, escapes, continuations
    depends_on: [base-quality-gates]
  - id: base-measurement
    file: templates/core/measurement.md
    description: Numerical routines, calibration against reference data, source silence
    depends_on: [base-quality]
platform:
  - id: platform-fixture
    file: templates/fixture/platform.md
    description: Test input for the platform checks; listed nowhere a project reads
    fixture: true
    depends_on: [base-quality-gates]

frontend:
  - id: frontend-ux
    file: templates/frontend/ux.md
    description: UX principles, WCAG 2.1 AA, responsive breakpoints
    depends_on: [base-quality]
  - id: frontend-quality
    file: templates/frontend/quality.md
    description: CSS conventions, performance, theme persistence, analytics, in-process UI test server
    depends_on: [base-quality]
  - id: frontend-content
    file: templates/frontend/content.md
    description: Build-agnostic content rules — content, assets, SEO, structured data
    depends_on: [base-docs, base-quality]

backend:
  - id: backend-http
    file: templates/backend/http.md
    description: Port, lifecycle, admin tasks, handlers, headers, methods, payloads, errors, auth
  - id: backend-api
    file: templates/backend/api.md
    description: API-first, OpenAPI, versioning, deprecation, pagination
    depends_on: [backend-http]
  - id: backend-database
    file: templates/backend/database.md
    description: Migrations, transactions, parameterised queries, connection pooling
  - id: backend-caching
    file: templates/backend/caching.md
    description: Cache-aside, TTL, invalidation, resilience, stampede
  - id: backend-auth
    file: templates/backend/auth.md
    description: Authn/authz, JWT, RBAC, sessions, API keys
    depends_on: [backend-http, base-security]
  - id: backend-jobs
    file: templates/backend/jobs.md
    description: Background jobs, idempotency, retry, DLQ, scheduling
  - id: backend-concurrency
    file: templates/backend/concurrency.md
    description: Threads vs. processes vs. async, shared state, structured concurrency
  - id: backend-messaging
    file: templates/backend/messaging.md
    description: Brokers, producers, consumers, schema, DLQ, observability
  - id: backend-webhooks
    file: templates/backend/webhooks.md
    description: Inbound webhook intake, edge signature verification, fast-ack, retry amplification
    depends_on: [backend-http, backend-messaging, base-security, backend-observability]
  - id: backend-edge
    file: templates/backend/edge.md
    description: Reverse proxy / edge — TLS termination, forwarded headers, upstream routing, timeouts, edge security
    depends_on: [backend-http, base-security, backend-observability]
  - id: backend-grpc
    file: templates/backend/grpc.md
    description: Proto design, status codes, interceptors, health check
    depends_on: [backend-auth, backend-observability]
  - id: backend-microservices
    file: templates/backend/microservices.md
    description: Service boundaries, inter-service comms, saga, contract testing
    depends_on: [backend-http, backend-api, backend-messaging]
  - id: backend-errors
    file: templates/backend/errors.md
    description: Classification, propagation, recovery, external failures
    depends_on: [backend-http, backend-observability]
  - id: backend-features
    file: templates/backend/features.md
    description: Feature flags, rollout strategy, experimentation
  - id: backend-observability
    file: templates/backend/observability.md
    description: Log levels, log format, health check, error visibility
  - id: backend-monitoring
    file: templates/backend/monitoring.md
    description: Key metrics, thresholds, alerts, dashboards, incidents
    depends_on: [backend-observability]
stacks:
  - id: stack-fixture
    file: templates/fixture/stack.md
    label: Fixture
    layer: fixture
    description: Test input for the per-stack checks; listed nowhere a project reads
    fixture: true
    depends_on: [base-security, base-quality-gates]
