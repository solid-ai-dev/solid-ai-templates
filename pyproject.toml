# Packages the checks under checks/ so pre-commit can install them as
# hooks. pre-commit requires this file at the repository root.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solid-ai-checks"

# Kept equal to the release tag; the release procedure bumps it.
version = "3.0.0"
description = "The checks the solid-ai templates prescribe, as pre-commit hooks"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
solid-ai-checks = "solid_ai_checks.__main__:main"

[tool.setuptools]
package-dir = { "" = "checks" }
packages = ["solid_ai_checks"]
