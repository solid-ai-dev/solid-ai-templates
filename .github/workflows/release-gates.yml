name: Release gates

# The release gates are parameterised by the version being released, and
# nothing in a repository's state distinguishes a release commit from an
# ordinary one -- so they reported "does not apply" on every run and only
# executed when an operator remembered to set the constant by hand. A tag
# push is the one event that does say a release is happening.
on:
  push:
    tags:
      - 'v*'
  # The tag is pushed after the irreversible step, so the automatic run
  # reports rather than prevents. This input is how the same gates run at
  # the release commit, where they can still refuse.
  workflow_dispatch:
    inputs:
      release:
        description: 'Version being released, e.g. v2.83.0'
        required: true

permissions:
  contents: read
  issues: read

jobs:
  # A lightweight tag carries no author, date or message, so a release
  # tag MUST be annotated. A dispatched run has no tag and skips this.
  annotated-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require an annotated release tag
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          type="$(git cat-file -t "${tag}")"
          if [ "${type}" != "tag" ]; then
            echo "::error::Release tag ${tag} is lightweight (${type})." \
                 "Tags MUST be annotated: git tag -a ${tag} -m '${tag}'."
            exit 1
          fi
          echo "Release tag ${tag} is annotated. OK."

  # Runs after the tag check passed, or after it was skipped on dispatch.
  gates:
    needs: annotated-tag
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The gates read the tag history to resolve the release they
      # follow, so a shallow clone resolves no baseline.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          upstream-repo: ${{ vars.UPSTREAM_REPO }}

      # A release never scoped to a milestone leaves RELEASE_MILESTONE
      # empty, and the checks reading it report that they do not apply.
      - name: Resolve the release and its milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_RELEASE: ${{ inputs.release }}
        run: |
          release="${DISPATCH_RELEASE:-${GITHUB_REF_NAME}}"
          title="$(python tools/release_check.py --milestone "${release}")"
          echo "RELEASE=${release}" >> "$GITHUB_ENV"
          echo "RELEASE_MILESTONE=${title}" >> "$GITHUB_ENV"
          echo "release:   ${release}"
          echo "milestone: ${title:-<none resolved>}"

      # The changelog cut is this repository's own release step; the
      # conformance run below carries the templates' checks.
      - name: Check the changelog cut names this release
        run: python tools/release_check.py "$RELEASE"

      - name: Run the release gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tests/run_conformance.py

  # The release's notes are its CHANGELOG.md section, so each entry is
  # written once. A rerun updates the notes of a release already made.
  publish:
    needs: gates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish the release with its changelog section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          python tools/release_check.py --notes "${tag}" > notes.md
          if gh release view "${tag}" > /dev/null 2>&1; then
            gh release edit "${tag}" --title "${tag}" --notes-file notes.md
          else
            gh release create "${tag}" --title "${tag}" \
              --notes-file notes.md --verify-tag
          fi
          gh release view "${tag}" --json tagName,name,isDraft
