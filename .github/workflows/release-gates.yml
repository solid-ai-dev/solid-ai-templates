name: Release gates

# The release gates are parameterised by the version being released, and
# nothing in a repository's state distinguishes a release commit from an
# ordinary one -- so they reported "does not apply" on every run and only
# executed when an operator remembered to set the constant by hand. A tag
# push is the one event that does say a release is happening.
on:
  push:
    tags:
      - 'v*'
  # The tag is pushed after the irreversible step, so the automatic run
  # reports rather than prevents. This input is how the same gates run at
  # the release commit, where they can still refuse.
  workflow_dispatch:
    inputs:
      release:
        description: 'Version being released, e.g. v2.83.0'
        required: true

permissions:
  contents: read
  issues: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # The gates read the tag history to resolve the release they
      # follow, so a shallow clone resolves no baseline.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      # A fork names its upstream in the UPSTREAM_REPO repository variable.
      # Its history then holds upstream's commits, whose issue numbers belong
      # to another tracker, and SYS-20 needs upstream's manifest to compare
      # against. Upstream sets no variable and skips this.
      - name: Fetch the upstream this fork names
        if: vars.UPSTREAM_REPO != ''
        env:
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
        run: |
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            "+refs/heads/main:refs/remotes/upstream/main"
          echo "SAIT_UPSTREAM_REF=upstream/main" >> "$GITHUB_ENV"
          echo "UPSTREAM_REF=upstream/main" >> "$GITHUB_ENV"
          git log -1 --format='upstream/main: %h %s' upstream/main
      - name: Resolve the release and its milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_RELEASE: ${{ inputs.release }}
        run: |
          release="${DISPATCH_RELEASE:-${GITHUB_REF_NAME}}"
          echo "RELEASE=${release}" >> "$GITHUB_ENV"

          # A milestone names its release alone or before " — " and a
          # theme: a minor's names the minor line, a patch's the full
          # version. The full version wins and the minor line is the
          # fallback. Matching the separator rather than a bare prefix
          # stops v2.8 claiming every v2.8x title. A release never scoped
          # to one leaves this unset, and the check reports that it does
          # not apply -- the correct reading, not a failure.
          titles="$(gh api "repos/${GITHUB_REPOSITORY}/milestones?state=all" --paginate --jq '.[].title')"
          named() { printf '%s\n' "${titles}" | awk -v v="$1" '$0 == v || index($0, v " — ") == 1'; }
          title="$(named "${release}")"
          [ -n "${title}" ] || title="$(named "$(echo "${release}" | cut -d. -f1,2)")"
          if [ "$(printf '%s' "${title}" | grep -c .)" -gt 1 ]; then
            echo "more than one milestone names ${release}:"
            printf '%s\n' "${title}"
            exit 1
          fi
          echo "RELEASE_MILESTONE=${title}" >> "$GITHUB_ENV"

          echo "release:   ${release}"
          echo "milestone: ${title:-<none resolved>}"
      # The changelog cut is this repository's own release step; the
      # conformance run below carries the templates' checks.
      - name: Check the changelog cut names this release
        run: python tools/release_check.py "$RELEASE"
      - name: Run the release gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tests/run_conformance.py
