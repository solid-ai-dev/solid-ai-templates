name: Smoke tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Each gate is its own job, so one failure does not hide the rest.
  gates:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Run smoke tests
            run: python tests/run.py smoke

          - name: Run the templates' own checks against this repository
            run: python tests/run.py conformance

          # A fork syncs by merging upstream. This merges the change under
          # test into a simulated fork and runs smoke on the result.
          - name: Check a fork that only appends merges this change
            run: python tests/run.py fork_sync

          - name: Check the release check still reads its planted cases
            run: python tools/check_release.py --self-test

          - name: Check generated docs are up to date
            run: python tools/sync_docs.py --check

          # Upstream offers no stack, so this reads a fork's cache of
          # resolved chains; upstream's run confirms the manifest parses.
          - name: Check the resolved stack chains are up to date
            run: python tools/resolve_chain.py --check

          - name: Check for new redundant rules
            run: python tools/audit_redundancy.py --check

          # A template may get better, never worse: each file's score is
          # held to its row in tests/baselines/template-quality.txt.
          - name: Check no template's quality score fell
            run: python tools/score_templates.py --check

          # The tooling is the gate, so an unused import or an undefined
          # name in it is a defect nothing else reports.
          - name: Lint the Python tooling
            run: |
              pip install pyflakes==4.0.2
              python -m pyflakes tools tests
    steps:
      # Fork sync forks from the merge base of HEAD and origin/main, and a
      # fork's release checks read its tag history, so a shallow clone
      # fails both.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          upstream-repo: ${{ vars.UPSTREAM_REPO }}

      - name: ${{ matrix.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.run }}

  # The config holds the rules and the files: every tracked Markdown file,
  # with no exemptions. The version is pinned so a release cannot turn a
  # green tree red.
  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: >-
          npx --yes markdownlint-cli2@0.23.3
          --config .github/linters/.markdownlint-cli2.jsonc

  # The same hooks a contributor runs locally, so the config cannot drift
  # from what CI enforces. gitleaks has its own job below.
  pre-commit:
    name: Run the pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - env:
          SKIP: gitleaks
        run: |
          pip install pre-commit==4.3.0
          pre-commit run --all-files --show-diff-on-failure

  # The binary is verified against the release's published SHA-256 before
  # it runs, so a replaced download fails here rather than scanning.
  gitleaks:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    env:
      ARCHIVE: gitleaks_8.21.2_linux_x64.tar.gz
      SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/${ARCHIVE}"
          echo "${SHA256}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "${ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - run: gitleaks detect --source . --verbose

  # Branch protection requires one check named smoke. This job carries that
  # name and passes only when every job above passed.
  smoke:
    if: always()
    needs: [gates, markdown, pre-commit, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = success ] || exit 1
          done
